  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    /* ═══ 设计令牌：双主题 ═══════════════════════════════ */
    :root {
      --radius: 14px;
      --radius-sm: 10px;
      --accent: #4f6ef7;
      --accent-soft: rgba(79, 110, 247, .1);
      --gold: #f5a623; --silver: #9aa7bd; --bronze: #cd8b4e;
      --green: #22c08a; --red: #ef5350; --amber: #f5a623;
      --brand-grad: linear-gradient(135deg, #ff8a3d 0%, #ff4d4f 100%);
      --shadow-1: 0 1px 2px rgba(16, 24, 40, .04), 0 1px 6px rgba(16, 24, 40, .05);
      --shadow-2: 0 6px 22px rgba(16, 24, 40, .09);
      --skel-grad: linear-gradient(100deg, transparent 30%, rgba(148,163,184,.14) 50%, transparent 70%);
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }
    html[data-theme="dark"] {
      --bg: #0b0f1a;
      --bg-soft: #0e1424;
      --surface: #121a2c;
      --surface-2: #1a2440;
      --surface-3: #222e4d;
      --border: #1f2b49;
      --text: #e7ecf6;
      --muted: #8391ad;
      --sub: #aab6cf;
      --header-bg: rgba(11, 15, 26, .82);
      --hover: rgba(79, 110, 247, .07);
      --shadow-1: 0 1px 2px rgba(0,0,0,.25), 0 1px 8px rgba(0,0,0,.3);
      --shadow-2: 0 10px 30px rgba(0,0,0,.45);
      color-scheme: dark;
    }
    html[data-theme="light"] {
      --bg: #f4f6fb;
      --bg-soft: #eef1f8;
      --surface: #ffffff;
      --surface-2: #f2f4fa;
      --surface-3: #e8ecf5;
      --border: #e5e9f2;
      --text: #1b2540;
      --muted: #71809e;
      --sub: #4c5a78;
      --header-bg: rgba(255, 255, 255, .85);
      --hover: rgba(79, 110, 247, .06);
      color-scheme: light;
    }

    html { font-size: 15px; scroll-behavior: smooth; }
    body {
      background: var(--bg); color: var(--text);
      font-family: var(--font);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      transition: background .25s, color .25s;
    }
    a { color: inherit; }
    button { font-family: inherit; }
    ::selection { background: rgba(79,110,247,.25); }

    /* ═══ HEADER ═════════════════════════════════════════ */
    header {
      position: sticky; top: 0; z-index: 200;
      background: var(--header-bg);
      backdrop-filter: blur(16px) saturate(1.4);
      -webkit-backdrop-filter: blur(16px) saturate(1.4);
      border-bottom: 1px solid var(--border);
    }
    .header-inner {
      max-width: 1400px; margin: 0 auto;
      display: flex; align-items: center; gap: 1rem;
      height: 58px; padding: 0 1.4rem;
    }
    .logo { display: flex; align-items: center; gap: .55rem; white-space: nowrap; flex-shrink: 0; cursor: pointer; user-select: none; }
    .logo-tile {
      width: 30px; height: 30px; border-radius: 9px;
      background: var(--brand-grad);
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
      box-shadow: 0 3px 10px rgba(255, 92, 61, .35);
    }
    .logo-text { font-size: 1.02rem; font-weight: 800; letter-spacing: .02em; }
    .logo-text b { color: var(--accent); }

    .cat-nav { display: flex; align-items: center; gap: .2rem; overflow-x: auto; scrollbar-width: none; flex: 1; }
    .cat-nav::-webkit-scrollbar { display: none; }
    .cat-btn {
      display: inline-flex; align-items: center; gap: .28rem;
      padding: .34rem .8rem; border-radius: 999px;
      border: 1px solid transparent; background: transparent;
      color: var(--muted); font-size: .8rem; font-weight: 500;
      cursor: pointer; white-space: nowrap; transition: all .18s;
    }
    .cat-btn:hover { background: var(--surface-2); color: var(--text); }
    .cat-btn.active {
      background: var(--accent); color: #fff; font-weight: 600;
      box-shadow: 0 2px 10px rgba(79,110,247,.3);
    }

    .header-tools { display: flex; align-items: center; gap: .4rem; flex-shrink: 0; }
    .icon-btn {
      display: inline-flex; align-items: center; gap: .3rem;
      padding: .36rem .7rem; border-radius: 9px;
      border: 1px solid var(--border); background: var(--surface);
      color: var(--sub); font-size: .78rem; cursor: pointer;
      transition: all .16s; white-space: nowrap;
    }
    .icon-btn:hover { border-color: var(--accent); color: var(--text); }
    .icon-btn.danger:hover { border-color: var(--red); color: var(--red); }
    .icon-btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .icon-btn.primary:hover { filter: brightness(1.08); }
    .icon-btn:disabled { opacity: .45; cursor: not-allowed; }
    .icon-btn.icon-only { padding: .36rem .5rem; font-size: .95rem; }
    .spinning { display: inline-block; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ═══ MAIN ═══════════════════════════════════════════ */
    main { max-width: 1400px; margin: 0 auto; padding: 1.1rem 1.4rem 4.5rem; }

    /* 搜索 */
    .search-wrap { position: relative; width: 100%; margin-bottom: .9rem; }
    .search-box {
      width: 100%; padding: .68rem 2.6rem .68rem 2.5rem;
      border-radius: 12px; border: 1px solid var(--border);
      background: var(--surface); color: var(--text);
      font-size: .9rem; outline: none; transition: border-color .15s, box-shadow .15s;
    }
    .search-box:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .search-box::placeholder { color: var(--muted); }
    .search-icon { position: absolute; left: .85rem; top: 50%; transform: translateY(-50%); font-size: .95rem; opacity: .55; pointer-events: none; }
    .search-clear {
      position: absolute; right: .7rem; top: 50%; transform: translateY(-50%);
      display: none; cursor: pointer; font-size: .8rem; color: var(--muted);
      background: var(--surface-2); width: 1.35rem; height: 1.35rem;
      border-radius: 50%; border: none; align-items: center; justify-content: center;
    }
    .search-clear.show { display: flex; }
    .search-results {
      display: none; margin-bottom: 1rem; overflow: hidden;
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-1);
    }
    .search-results.show { display: block; animation: fadeUp .18s; }
    .search-results-header { padding: .6rem 1rem; font-size: .78rem; color: var(--muted); border-bottom: 1px solid var(--border); background: var(--surface-2); }
    .search-item { display: flex; align-items: center; gap: .6rem; padding: .55rem 1rem; border-bottom: 1px solid var(--border); transition: background .12s; }
    .search-item:last-child { border-bottom: none; }
    .search-item:hover { background: var(--hover); }
    .search-item-rank { font-size: .7rem; color: var(--muted); min-width: 1.6rem; font-variant-numeric: tabular-nums; }
    .search-item-title { flex: 1; font-size: .86rem; text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .search-item-title:hover { color: var(--accent); }
    .search-item-plat { font-size: .66rem; color: #fff; padding: .13rem .5rem; border-radius: 5px; white-space: nowrap; }
    .search-empty { padding: 1.6rem; text-align: center; color: var(--muted); font-size: .84rem; }
    mark.hl { background: rgba(245,166,35,.25); color: var(--gold); padding: 0 2px; border-radius: 3px; }

    /* 状态条 */
    .status-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; flex-wrap: wrap; gap: .4rem; }
    .status-left { display: flex; align-items: center; gap: .6rem; flex-wrap: wrap; }
    .plat-tabs { display: flex; gap: .25rem; flex-wrap: wrap; align-items: center; }
    .plat-tab {
      padding: .22rem .62rem; border-radius: 999px; border: 1px solid var(--border);
      background: transparent; color: var(--muted); font-size: .73rem; cursor: pointer; transition: all .14s;
    }
    .plat-tab:hover { background: var(--surface-2); color: var(--text); }
    .plat-tab.active { color: #fff; border-color: transparent; }
    .status-right { font-size: .72rem; color: var(--muted); display: flex; align-items: center; gap: .4rem; }
    .live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 3px rgba(34,192,138,.18); animation: breathe 2.4s ease-in-out infinite; }
    @keyframes breathe { 0%,100% { opacity: 1; } 50% { opacity: .45; } }

    /* ═══ 网格与卡片 ════════════════════════════════════ */
    .news-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(322px, 1fr)); gap: 1rem; }
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); overflow: hidden;
      box-shadow: var(--shadow-1);
      transition: transform .18s, box-shadow .18s, border-color .18s;
      display: flex; flex-direction: column;
    }
    .card:hover { transform: translateY(-2px); box-shadow: var(--shadow-2); border-color: color-mix(in srgb, var(--pc) 38%, var(--border)); }
    .card-head { display: flex; align-items: center; gap: .55rem; padding: .8rem .95rem .65rem; }
    .plat-tile {
      width: 28px; height: 28px; border-radius: 8px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center; font-size: 15px;
      background: color-mix(in srgb, var(--pc) 16%, transparent);
    }
    .card-name { font-size: .88rem; font-weight: 700; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .badge { font-size: .64rem; padding: .14rem .48rem; border-radius: 999px; border: 1px solid; white-space: nowrap; font-weight: 500; }
    .badge.rt { color: var(--green); border-color: color-mix(in srgb, var(--green) 40%, transparent); background: color-mix(in srgb, var(--green) 9%, transparent); }
    .badge.nrt { color: var(--muted); border-color: var(--border); }
    .badge.delay { color: var(--amber); border-color: color-mix(in srgb, var(--amber) 45%, transparent); background: color-mix(in srgb, var(--amber) 10%, transparent); }
    .badge.dead { color: var(--red); border-color: color-mix(in srgb, var(--red) 40%, transparent); background: color-mix(in srgb, var(--red) 8%, transparent); }
    .card-link { font-size: .68rem; color: var(--muted); text-decoration: none; transition: color .13s; }
    .card-link:hover { color: var(--accent); }

    .news-list { list-style: none; flex: 1; padding: .15rem 0 .35rem; }
    .news-item {
      display: flex; align-items: center; gap: .55rem;
      padding: .44rem .95rem; transition: background .12s;
    }
    .news-item:hover { background: var(--hover); }
    .rank {
      min-width: 19px; height: 19px; display: inline-flex; align-items: center; justify-content: center;
      font-size: .7rem; font-weight: 700; color: var(--muted);
      font-variant-numeric: tabular-nums; border-radius: 6px; flex-shrink: 0;
    }
    .rank.r1 { background: color-mix(in srgb, var(--gold) 18%, transparent); color: var(--gold); }
    .rank.r2 { background: color-mix(in srgb, var(--silver) 18%, transparent); color: var(--silver); }
    .rank.r3 { background: color-mix(in srgb, var(--bronze) 18%, transparent); color: var(--bronze); }
    .news-link {
      flex: 1; font-size: .84rem; line-height: 1.5; color: var(--text);
      text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; transition: color .12s;
    }
    .news-link:hover { color: var(--accent); }
    .item-actions { display: flex; align-items: center; gap: .3rem; flex-shrink: 0; }
    .hot-tag { font-size: .67rem; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
    .hot-tag.hot1 { color: var(--gold); font-weight: 600; }
    .fav-btn {
      background: none; border: none; cursor: pointer; font-size: .82rem;
      color: var(--muted); padding: .1rem; border-radius: 5px; transition: color .12s; line-height: 1;
    }
    .fav-btn:hover, .fav-btn.active { color: var(--gold); }

    /* 卡片内骨架 */
    .skel-line { height: 13px; border-radius: 6px; margin: .58rem .95rem; background: var(--surface-2); position: relative; overflow: hidden; }
    .skel-line::after { content: ""; position: absolute; inset: 0; background: var(--skel-grad); animation: shimmer 1.4s infinite; }
    .w82 { width: 82%; } .w64 { width: 64%; } .w73 { width: 73%; } .w55 { width: 55%; }
    @keyframes shimmer { from { transform: translateX(-100%); } to { transform: translateX(100%); } }

    .empty-row { padding: 1.6rem 1rem; text-align: center; color: var(--muted); font-size: .8rem; display: flex; flex-direction: column; align-items: center; gap: .5rem; }
    .empty-row .emo { font-size: 1.5rem; opacity: .8; }

    /* ═══ 全网热榜（融合视图）════════════════════════════ */
    .hotboard-wrap { max-width: 860px; margin: 0 auto; }
    .hotboard-hero { text-align: center; padding: 1.4rem .6rem 1.1rem; }
    .hotboard-hero .title { font-size: 1.5rem; font-weight: 800; letter-spacing: .01em; }
    .hotboard-hero .title .grad { background: var(--brand-grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .hotboard-hero .sub { font-size: .76rem; color: var(--muted); margin-top: .4rem; }
    .hotboard-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); box-shadow: var(--shadow-1); overflow: hidden;
    }
    .hb-item {
      display: flex; align-items: center; gap: .8rem;
      padding: .62rem 1.1rem; border-bottom: 1px solid var(--border);
      transition: background .12s; position: relative;
    }
    .hb-item:last-child { border-bottom: none; }
    .hb-item:hover { background: var(--hover); }
    .hb-rank {
      min-width: 26px; height: 26px; display: inline-flex; align-items: center; justify-content: center;
      font-size: .82rem; font-weight: 800; color: var(--muted);
      font-variant-numeric: tabular-nums; border-radius: 8px; flex-shrink: 0;
    }
    .hb-rank.r1 { background: var(--brand-grad); color: #fff; box-shadow: 0 3px 10px rgba(255,92,61,.35); }
    .hb-rank.r2 { background: color-mix(in srgb, var(--gold) 22%, transparent); color: var(--gold); }
    .hb-rank.r3 { background: color-mix(in srgb, var(--bronze) 20%, transparent); color: var(--bronze); }
    .hb-main { flex: 1; min-width: 0; }
    .hb-title { font-size: .92rem; font-weight: 600; text-decoration: none; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .hb-title:hover { color: var(--accent); }
    .hb-meta { display: flex; align-items: center; gap: .35rem; margin-top: .28rem; flex-wrap: wrap; }
    .src-chip {
      font-size: .62rem; padding: .1rem .42rem; border-radius: 4px; color: #fff;
      white-space: nowrap; opacity: .92;
    }
    .src-chip.lead { outline: 1.5px solid rgba(255,255,255,.35); }
    .hb-hot { font-size: .68rem; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; flex-shrink: 0; }
    .hb-fav { background: none; border: none; cursor: pointer; font-size: .85rem; color: var(--muted); flex-shrink: 0; }
    .hb-fav:hover, .hb-fav.active { color: var(--gold); }

    /* ═══ 失败折叠区 ═════════════════════════════════════ */
    .failed-section { margin-top: 1.4rem; border: 1px solid color-mix(in srgb, var(--red) 22%, var(--border)); border-radius: var(--radius); overflow: hidden; background: color-mix(in srgb, var(--red) 3%, var(--surface)); }
    .failed-toggle { display: flex; align-items: center; justify-content: space-between; padding: .68rem 1rem; cursor: pointer; user-select: none; font-size: .78rem; color: var(--muted); transition: background .15s; }
    .failed-toggle:hover { background: color-mix(in srgb, var(--red) 5%, transparent); }
    .failed-toggle-left { display: flex; align-items: center; gap: .5rem; }
    .failed-badge { background: color-mix(in srgb, var(--red) 14%, transparent); color: var(--red); border: 1px solid color-mix(in srgb, var(--red) 30%, transparent); border-radius: 999px; padding: .08rem .55rem; font-size: .7rem; }
    .failed-arrow { transition: transform .2s; font-size: .72rem; }
    .failed-arrow.open { transform: rotate(180deg); }
    .failed-body { display: none; border-top: 1px solid color-mix(in srgb, var(--red) 14%, var(--border)); padding: .6rem; }
    .failed-body.open { display: block; }
    .failed-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: .5rem; }
    .failed-card { background: var(--surface); border: 1px solid color-mix(in srgb, var(--red) 14%, var(--border)); border-radius: var(--radius-sm); padding: .6rem .8rem; display: flex; flex-direction: column; gap: .3rem; }
    .failed-card-name { display: flex; align-items: center; gap: .4rem; font-size: .8rem; font-weight: 600; }
    .failed-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--red); flex-shrink: 0; }
    .failed-card-note { font-size: .67rem; color: var(--muted); padding-left: .82rem; word-break: break-all; }
    .retry-btn { font-size: .7rem; color: var(--text); cursor: pointer; background: var(--surface-3); border: 1px solid var(--border); padding: .22rem .6rem; border-radius: 999px; transition: all .15s; }
    .retry-btn:hover:not(:disabled) { background: var(--accent); border-color: var(--accent); color: #fff; }
    .retry-btn:disabled { opacity: .6; cursor: wait; }

    /* ═══ 单平台全屏 ════════════════════════════════════ */
    .full-view { display: none; }
    .full-view.active { display: block; animation: fadeUp .2s; }
    .full-view .card { max-width: 720px; margin: 0 auto; }
    .full-view .news-item { padding: .5rem 1.3rem; }

    /* ═══ 弹层/抽屉/Toast ═══════════════════════════════ */
    .modal-overlay { display: none; position: fixed; inset: 0; z-index: 500; background: rgba(8, 12, 24, .55); backdrop-filter: blur(4px); align-items: center; justify-content: center; }
    .modal-overlay.open { display: flex; animation: fadeIn .18s; }
    .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; width: 380px; max-width: calc(100vw - 2rem); padding: 1.5rem; box-shadow: var(--shadow-2); }
    .modal h3 { font-size: 1rem; margin-bottom: 1rem; }
    .modal-tabs { display: flex; gap: .5rem; margin-bottom: .9rem; }
    .modal-tab { flex: 1; padding: .42rem; border-radius: 9px; border: 1px solid var(--border); background: transparent; color: var(--muted); font-size: .8rem; cursor: pointer; transition: all .15s; }
    .modal-tab.active { background: var(--accent); border-color: var(--accent); color: #fff; }
    .modal input { width: 100%; padding: .55rem .75rem; border-radius: 9px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text); font-size: .86rem; margin-bottom: .6rem; outline: none; transition: border-color .15s; }
    .modal input:focus { border-color: var(--accent); }
    .modal-footer { display: flex; gap: .5rem; margin-top: .7rem; justify-content: flex-end; }
    .modal-err { color: var(--red); font-size: .76rem; margin: -.25rem 0 .5rem; min-height: 1em; }

    .user-menu-wrap { position: relative; }
    .user-dropdown { display: none; position: absolute; top: calc(100% + 8px); right: 0; background: var(--surface); border: 1px solid var(--border); border-radius: 11px; min-width: 160px; padding: .4rem 0; box-shadow: var(--shadow-2); z-index: 300; }
    .user-dropdown.open { display: block; animation: fadeUp .15s; }
    .user-dropdown a, .user-dropdown button { display: block; width: 100%; text-align: left; padding: .5rem 1rem; font-size: .8rem; color: var(--text); background: none; border: none; cursor: pointer; text-decoration: none; transition: background .12s; }
    .user-dropdown a:hover, .user-dropdown button:hover { background: var(--hover); }
    .user-dropdown .sep { border-top: 1px solid var(--border); margin: .3rem 0; }

    .drawer-overlay { display: none; position: fixed; inset: 0; z-index: 400; background: rgba(8,12,24,.5); backdrop-filter: blur(3px); }
    .drawer-overlay.open { display: block; animation: fadeIn .2s; }

<body>

<!-- ═══ HEADER ═════════════════════════════════════════ -->
<header>
  <div class="header-inner">
    <div class="logo" onclick="gotoHotboard()" title="回到全网热榜">
      <div class="logo-tile">🔥</div>
      <div class="logo-text">新闻<b>汇总</b></div>
    </div>

    <nav class="cat-nav" id="catNav">
      <button class="cat-btn active" data-cat="__hot">⚡ 全网热榜</button>
      <button class="cat-btn" data-cat="综合">🌐 综合</button>

      <button class="cat-btn" data-cat="军事国际">🌍 军事国际</button>
      <button class="cat-btn" data-cat="体育">⚽ 体育</button>
    </nav>

    <div class="header-tools">
      <button class="icon-btn icon-only" id="themeBtn" onclick="toggleTheme()" title="切换亮/暗主题" aria-label="切换主题">🌙</button>
      <button class="icon-btn icon-only" id="bgBtn" onclick="openBgPanel()" title="设置背景图" aria-label="背景图">🖼️</button>
      <button class="icon-btn" id="refreshBtn" onclick="refreshCurrent(true)" aria-label="刷新">
        <span id="spinIcon">↻</span><span class="btn-text"> 刷新</span>
      </button>
      <button class="icon-btn" id="shareBtn" onclick="openShare()" aria-label="分享">
        🔗<span class="btn-text"> 分享</span>
      </button>
      <button class="icon-btn primary" id="loginBtn" onclick="openAuthModal()">登录</button>
      <div class="user-menu-wrap" id="userMenu" style="display:none">
        <button class="icon-btn" id="userNameBtn" onclick="toggleUserMenu()">👤 <span id="userNameText"></span> ▾</button>
        <div class="user-dropdown" id="userDropdown">
          <a href="#" onclick="openDrawer('fav');return false">⭐ 我的收藏</a>
          <a href="#" onclick="openDrawer('history');return false">🕒 浏览记录</a>
          <div class="sep"></div>
          <button onclick="logout()">退出登录</button>
        </div>
      </div>
    </div>
  </div>
</header>

<!-- ═══ MAIN ═══════════════════════════════════════════ -->
<main>
  <div class="search-wrap">
    <span class="search-icon">🔎</span>
    <input type="text" id="globalSearch" class="search-box"
           placeholder="搜索全部平台的热点标题…（按 / 聚焦，回车打开首条结果）"
           autocomplete="off" />
    <button class="search-clear" id="searchClear" onclick="clearSearch()">✕</button>
  </div>
  <div class="search-results" id="searchResults">
    <div class="search-results-header" id="searchHeader"></div>
    <div id="searchBody"></div>
  </div>

  <div class="status-bar">
    <div class="status-left"><div class="plat-tabs" id="platTabs"></div></div>
    <div class="status-right"><span class="live-dot"></span><span id="updateTime">正在加载…</span></div>
  </div>

  <!-- 全网热榜（融合视图） -->
  <div class="hotboard-wrap" id="hotboardView" style="display:none">
    <div class="hotboard-hero">
      <div class="title">⚡ 全网<span class="grad">热榜</span></div>
      <div class="sub" id="hotboardSub">融合微博 / 百度 / 抖音 / 头条 / 知乎 / B站 / 贴吧 的实时热搜</div>
    </div>
    <div class="hotboard-card" id="hotboardCard"></div>
  </div>

  <!-- 平台网格 -->
  <div class="news-grid" id="newsGrid"></div>

  <!-- 单平台全屏 -->
  <div class="full-view" id="fullView"><div class="card" id="fullCard"></div></div>

  <!-- 失败平台折叠区 -->
  <div id="failedSection" class="failed-section" style="display:none">

        <span>⚠️</span>
        <span id="failedLabel">以下平台暂时无法抓取（点击展开）</span>
        <span class="failed-badge" id="failedBadge">0</span>
      </div>
      <span class="failed-arrow" id="failedArrow">▼</span>
    </div>
    <div class="failed-body" id="failedBody"><div class="failed-grid" id="failedGrid"></div></div>

  <div class="stats-bar">
    <span>👁️ 访问 <span id="busuanzi_value_site_pv"></span> 次</span>

<button id="backTop" onclick="window.scrollTo({top:0,behavior:'smooth'})" aria-label="回到顶部">↑</button>

<!-- ═══ 背景图设置 ═════════════════════════════════════ -->
<div class="modal-overlay" id="bgModal" onclick="if(event.target.id==='bgModal')closeBgPanel()">

    <h3>🖼️ 背景图</h3>
    <div class="bg-panel-row">
      <button class="icon-btn" onclick="document.getElementById('bgFolderInput').click()">📁 选择图片文件夹</button>

      <input type="file" id="bgFolderInput" webkitdirectory multiple accept="image/*" style="display:none" />
      <input type="file" id="bgFileInput" multiple accept="image/*" style="display:none" />
    </div>
    <div class="bg-panel-row">
      <button class="icon-btn" onclick="useDefaultBg()">🖼 恢复默认背景</button>
      <button class="icon-btn" onclick="bgOff()">🚫 关闭背景</button>

    <div id="bgStatus" style="font-size:.72rem;color:var(--muted);min-height:1.2em"></div>

      <span class="bg-panel-label">透明度</span>

    </div>
    <div class="modal-footer" style="justify-content:space-between">

      <button class="icon-btn" onclick="closeAuthModal()">取消</button>
      <button class="icon-btn primary" id="authSubmitBtn" onclick="submitAuth()">登录</button>

  </div>
</div>

<!-- ═══ 收藏/历史抽屉 ═════════════════════════════════ -->
<div class="drawer-overlay" id="drawerOverlay" onclick="closeDrawer()"></div>

function esc(s) {
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function rankCls(n) { return n<=3 ? `rank r${n}` : "rank"; }

function showToast(msg, dur = 2200) {

// API 请求：501（云端未配 D1）等场景统一提示
async function api(url, opts = {}) {
  const resp = await fetch(url, opts);
  if (resp.status === 501) {
    let data = {}; try { data = await resp.json(); } catch {}
    throw Object.assign(new Error(data.error || "此部署未启用账号功能"), { code: 501 });
  }
  return resp;
}

async function submitAuth() {
  const username = document.getElementById("authUsername").value.trim();
  const password = document.getElementById("authPassword").value;
  const errEl = document.getElementById("authErr");
  if (!username || !password) { errEl.textContent = "请填写完整"; return; }
  const btn = document.getElementById("authSubmitBtn");
  btn.disabled = true;
  try {
    const resp = await api(`/api/auth/${authMode}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, password }),
    });
    const data = await resp.json();
    if (!resp.ok) { errEl.textContent = data.error || "操作失败"; return; }
    authToken = data.token;
    authUser = { username: data.username, user_id: data.user_id };
    localStorage.setItem("hn_token", authToken);
    localStorage.setItem("hn_user", JSON.stringify(authUser));
    closeAuthModal(); updateAuthUI();
    showToast("🎉 " + (authMode === "login" ? "登录成功" : "注册成功"));
  } catch (e) {
    errEl.textContent = e.code === 501 ? e.message : "网络错误，请重试";
  } finally { btn.disabled = false; }
}

async function loadFavIds() {
  if (!authUser) return;
  try {
    const resp = await api("/api/favorites", { headers: { Authorization: "Bearer " + authToken } });
    if (!resp.ok) return;
    favIds = new Set((await resp.json()).map(f => f.url));
    refreshFavBtns();
  } catch (e) { if (e.code === 501) showToast(e.message); }
}
function refreshFavBtns() {
  document.querySelectorAll(".fav-btn,.hb-fav").forEach(btn => {
    const url = btn.dataset.url;
    btn.classList.toggle("active", favIds.has(url));
    btn.title = favIds.has(url) ? "取消收藏" : "收藏";
  });
}
async function toggleFav(btn) {
  if (!authUser) { openAuthModal(); return; }
  const { url, title, platform } = btn.dataset;
  try {
    if (favIds.has(url)) {
      const resp = await api("/api/favorites", { headers: { Authorization: "Bearer " + authToken } });
      const fav = (await resp.json()).find(f => f.url === url);
      if (fav) await api("/api/favorites/" + fav.id, { method: "DELETE", headers: { Authorization: "Bearer " + authToken } });
      favIds.delete(url); showToast("已取消收藏");
    } else {
      await api("/api/favorites", {
        method: "POST",
        headers: { Authorization: "Bearer " + authToken, "Content-Type": "application/json" },
        body: JSON.stringify({ title, url, platform }),
      });
      favIds.add(url); showToast("⭐ 已收藏");
    }
  } catch (e) { showToast(e.code === 501 ? e.message : "操作失败"); return; }
  refreshFavBtns();
}
async function trackHistory(title, url, platform) {
  if (!authUser) return;
  try {
    await api("/api/history", {
      method: "POST",
      headers: { Authorization: "Bearer " + authToken, "Content-Type": "application/json" },
      body: JSON.stringify({ title, url, platform }),
    });
  } catch {}
}

  }
}

function badgeFor(data) {

// 标题规范化（融合去重用）
function normTitle(t) {
  return String(t).replace(/[^\u4e00-\u9fa5a-z0-9]/gi, "").toLowerCase();
}

// 全网热榜融合：加权得分 + 跨平台去重合并
function buildHotboard() {
  const entries = new Map(); // normKey -> {title,url,hot,score,srcs:[{pid,rank}]}
  for (const { pid, w } of MERGE_SOURCES) {
    const data = newsCache[pid];
    if (!data || !data.items) continue;
    data.items.forEach((it, idx) => {
      const rank = it.rank || idx + 1;
      if (rank > 20) return;
      const key = normTitle(it.title);
      if (!key || key.length < 4) return;
      const score = w * (21 - rank);
      const exist = entries.get(key);
      if (exist) {
        exist.score += score * 0.55;   // 多平台同时上榜 = 更热
        exist.srcs.push({ pid, rank });
        if (rank < exist.bestRank) {
          exist.bestRank = rank; exist.title = it.title; exist.url = it.url; exist.hot = it.hot || exist.hot;
        }
      } else {
        entries.set(key, { title: it.title, url: it.url, hot: it.hot || "", score, bestRank: rank, srcs: [{ pid, rank }] });
      }
    });
  }
  return [...entries.values()].sort((a, b) => b.score - a.score).slice(0, 30);
}

function renderHotboard() {
  const card = document.getElementById("hotboardCard");
  const merged = buildHotboard();
  const okSrcs = MERGE_SOURCES.map(s => s.pid).filter(pid => {
    const d = newsCache[pid]; return d && d.items && d.items.length;
  });
  document.getElementById("hotboardSub").textContent =
    `融合 ${okSrcs.length} 个实时热搜榜单 · 每 5 分钟自动更新`;
  if (!merged.length) {
    card.innerHTML = Array.from({ length: 8 }).map(() =>
      `<div class="skel-line" style="margin:.8rem 1rem;width:70%"></div>`).join("");
    return;
  }
  card.innerHTML = merged.map((it, i) => {
    const isFav = favIds.has(it.url);
    const chips = it.srcs.slice(0, 3).map((s, si) => {
      const m = PLATFORM_META[s.pid] || {};
      return `<span class="src-chip${si === 0 ? " lead" : ""}" style="background:${m.color || "#666"}">${m.label || s.pid}</span>`;
    }).join("");
    return `<div class="hb-item">
      <span class="${hbRankCls(i + 1)}">${i + 1}</span>
      <div class="hb-main">
        <a class="hb-title" href="${esc(it.url)}" target="_blank" rel="noopener" title="${esc(it.title)}"
           onclick='trackHistory(${JSON.stringify(String(it.title)).replace(/'/g, "&#39;")},${JSON.stringify(String(it.url)).replace(/'/g, "&#39;")},"hotboard")'>${esc(it.title)}</a>
        <div class="hb-meta">${chips}${it.srcs.length > 3 ? `<span class="hb-hot">+${it.srcs.length - 3} 平台</span>` : ""}</div>
      </div>
      ${it.hot ? `<span class="hb-hot">${esc(it.hot)}</span>` : ""}
      <button class="hb-fav${isFav ? " active" : ""}" data-url="${esc(it.url)}"
        data-title="${esc(it.title).replace(/"/g, "&quot;")}" data-platform="hotboard"
        onclick="toggleFav(this)">${isFav ? "⭐" : "☆"}</button>
    </div>`;
  }).join("");
}

function renderView() {
  const grid = document.getElementById("newsGrid");
  const full = document.getElementById("fullView");
  const hot = document.getElementById("hotboardView");
  const failedIds = new Set(failedPlatforms.map(fp => fp.platform));

  if (currentCat === HOT_CAT) {
    grid.style.display = "none"; full.classList.remove("active");
    hot.style.display = "block";
    renderHotboard();
  } else if (!currentPlat) {
    hot.style.display = "none"; full.classList.remove("active");
    grid.style.display = "grid";
    grid.innerHTML = (CATEGORIES[currentCat] || [])
      .filter(pid => !failedIds.has(pid))
      .map(pid => `<div class="card" id="card-${pid}" style="--pc:${(PLATFORM_META[pid] || {}).color || "#4f6ef7"}">${renderCard(pid, newsCache[pid], true)}</div>`)
      .join("");
  } else {
    hot.style.display = "none"; grid.style.display = "none";
    full.classList.add("active");
    document.getElementById("fullCard").style.setProperty("--pc", (PLATFORM_META[currentPlat] || {}).color || "#4f6ef7");
    document.getElementById("fullCard").innerHTML = renderCard(currentPlat, newsCache[currentPlat], false);
  }
  refreshFavBtns();
  renderFailedSection();
}

// ════ 失败折叠区 ══════════════════════════════════════
function toggleFailed() {
  const body = document.getElementById("failedBody");
  document.getElementById("failedArrow").classList.toggle("open", body.classList.toggle("open"));
}
function renderFailedSection() {
  const section = document.getElementById("failedSection");
  if (!failedPlatforms.length) { section.style.display = "none"; return; }
  document.getElementById("failedBadge").textContent = failedPlatforms.length;
  document.getElementById("failedLabel").textContent = `以下 ${failedPlatforms.length} 个平台暂时无法抓取（点击展开）`;
  section.style.display = "block";
  document.getElementById("failedGrid").innerHTML = failedPlatforms.map(fp => {
    const m = PLATFORM_META[fp.platform] || {};
    return `<div class="failed-card">
      <div class="failed-card-name"><span class="failed-dot"></span><span>${m.emoji || ""} ${esc(fp.name)}</span></div>
      <div class="failed-card-note">${esc(fp.note || "抓取失败")}</div>
      <div style="display:flex;gap:.7rem;align-items:center;padding-left:.7rem">
        <button onclick="retryPlatform('${fp.platform}')" class="retry-btn">🔄 重试</button>
        <a href="${m.home || "#"}" target="_blank" rel="noopener" style="font-size:.7rem;color:var(--accent);text-decoration:none">↗ 官网</a>
      </div>
    </div>`;
  }).join("");
}
async function retryPlatform(pid) {
  const btn = event && event.target;
  if (btn) { btn.disabled = true; btn.textContent = "⏳ 重试中…"; }
  try {
    const resp = await fetch(`/api/news/batch?platforms=${pid}&refresh=1`);
    if (!resp.ok) throw new Error("HTTP " + resp.status);
    const data = await resp.json();
    const { _meta, ...clean } = data;
    Object.assign(newsCache, clean);
    if (clean[pid] && clean[pid].items && clean[pid].items.length) {
      failedPlatforms = failedPlatforms.filter(fp => fp.platform !== pid);
    }
    renderView(); updateTimeDisplay();
  } catch (e) {
    console.error("重试失败:", e);
    if (btn) { btn.disabled = false; btn.textContent = "🔄 重试"; }
  }
}

// ══════════════════════════════════════════════════════
// 数据加载（localStorage 秒开 + 后台静默刷新）
// ══════════════════════════════════════════════════════
function saveLocal() {
  try {
    localStorage.setItem(LS_KEY, JSON.stringify({ newsCache, catMeta, ts: Date.now() }));
  } catch {}
}
function loadLocal() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) return;
    const { newsCache: nc, catMeta: cm } = JSON.parse(raw);
    if (nc && typeof nc === "object") newsCache = nc;
    if (cm && typeof cm === "object") catMeta = cm;
  } catch {}
}

function pidsForView(cat, plat) {
  if (cat === HOT_CAT) return MERGE_PIDS;
  if (plat) return [plat];
  return CATEGORIES[cat] || [];
}

async function refreshCurrent(forceRefresh = false) {
  if (loading && !forceRefresh) return;
  const pids = pidsForView(currentCat, currentPlat);
  const hasVisible = pids.some(pid => {
    const d = newsCache[pid]; return d && d.items && d.items.length;
  });

  if (!forceRefresh && hasVisible) {
    renderView(); updateTimeDisplay();
    silentRefresh(pids);
    return;
  }

  loading = true;
  const btn = document.getElementById("refreshBtn");
  const spin = document.getElementById("spinIcon");
  if (forceRefresh) { btn.disabled = true; spin.classList.add("spinning"); }
  document.getElementById("updateTime").textContent = hasVisible ? "正在刷新…" : "正在加载…";
  if (!hasVisible) renderView();

  await doFetch(pids, forceRefresh);

  loading = false;
  if (forceRefresh) { btn.disabled = false; spin.classList.remove("spinning"); }
  updateTimeDisplay(); renderView(); saveLocal();
}

async function silentRefresh(pids) {
  loading = true;
  await doFetch(pids, false);
  loading = false;
  const key = currentCat === HOT_CAT ? HOT_CAT : currentCat;
  catMeta[key] = { fetchTime: Date.now(), failed: failedPlatforms.slice() };
  if (key === currentCat) { updateTimeDisplay(); renderView(); }
  saveLocal();
}

async function doFetch(pids, forceRefresh) {
  try {
    const refreshParam = forceRefresh ? "&refresh=1" : "";
    const resp = await fetch(`/api/news/batch?platforms=${pids.join(",")}${refreshParam}`);
    if (!resp.ok) throw new Error("HTTP " + resp.status);
    const data = await resp.json();
    failedPlatforms = (data._meta && data._meta.failed) || [];
    const { _meta, ...clean } = data;
    Object.assign(newsCache, clean);
    catMeta[currentCat === HOT_CAT ? HOT_CAT : currentCat] = {
      fetchTime: Date.now(), failed: failedPlatforms.slice(),
    };
  } catch (e) { console.error("加载失败:", e); }
}

function updateTimeDisplay() {
  const el = document.getElementById("updateTime");
  const key = currentCat === HOT_CAT ? HOT_CAT : currentCat;
  const meta = catMeta[key];
  if (!meta) { el.textContent = "正在加载…"; return; }
  const sec = Math.floor((Date.now() - meta.fetchTime) / 1000);
  const timeStr = sec < 60 ? `${sec} 秒前` : `${Math.floor(sec / 60)} 分钟前`;
  const nOk = pidsForView(currentCat, currentPlat).filter(pid => {
    const d = newsCache[pid]; return d && d.items && d.items.length;
  }).length;
  el.textContent = `${nOk}/${pidsForView(currentCat, currentPlat).length} 个平台 · ${timeStr}`;
}

// 分享
// ══════════════════════════════════════════════════════
function openShare() {
  document.getElementById("shareOverlay").classList.add("open");
  document.getElementById("sharePopup").classList.add("open");
}
function closeShare() {
  document.getElementById("shareOverlay").classList.remove("open");
  document.getElementById("sharePopup").classList.remove("open");
}
function shareNative() {
  if (navigator.share) {
    navigator.share({ title: document.title, text: "🔥 热点聚合 · 全网热榜一站看", url: location.href })
      .then(() => closeShare()).catch(() => {});
  } else shareCopy();
}
function shareQQ() {
  window.open(`https://connect.qq.com/widget/shareqq/index.html?url=${encodeURIComponent(location.href)}&title=${encodeURIComponent(document.title)}`, "_blank", "width=640,height=480");
  closeShare();
}
function shareWeibo() {
  window.open(`https://service.weibo.com/share/share.php?url=${encodeURIComponent(location.href)}&title=${encodeURIComponent(document.title + " 🔥")}`, "_blank", "width=620,height=450");
  closeShare();
}
function shareCopy() {
  const done = () => { showToast("✅ 链接已复制"); closeShare(); };
  if (navigator.clipboard?.writeText) {
    navigator.clipboard.writeText(location.href).then(done).catch(() => fallbackCopy());
  } else fallbackCopy();
  function fallbackCopy() {
    const ta = document.createElement("textarea");
    ta.value = location.href; ta.style.cssText = "position:fixed;opacity:0";
    document.body.appendChild(ta); ta.focus(); ta.select();
    try { document.execCommand("copy"); done(); } catch { showToast("复制失败，请手动复制地址栏"); }
    document.body.removeChild(ta);
  }
}

// ══════════════════════════════════════════════════════
// 搜索（纯客户端，跨已加载平台）
// ══════════════════════════════════════════════════════
let _searchTimer = null;
function onSearchInput(v) {
  document.getElementById("searchClear").classList.toggle("show", !!v);
  clearTimeout(_searchTimer);
  _searchTimer = setTimeout(() => runSearch(v), 240);
}
function clearSearch() {
  const box = document.getElementById("globalSearch");
  box.value = "";
  document.getElementById("searchClear").classList.remove("show");
  document.getElementById("searchResults").classList.remove("show");
  box.focus();
}
function escapeReg(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }
function runSearch(query) {
  const panel = document.getElementById("searchResults");
  const body = document.getElementById("searchBody");
  query = (query || "").trim();
  if (!query) { panel.classList.remove("show"); return; }
  const re = new RegExp(escapeReg(query), "i");
  const matches = [];
  for (const pid in newsCache) {
    const data = newsCache[pid];
    if (!data || !data.items) continue;
    const m = PLATFORM_META[pid] || { label: pid, color: "#666" };
    for (const it of data.items) {
      if (re.test(it.title || "")) matches.push({ ...it, pid, platLabel: m.label, platColor: m.color });
    }
  }
  matches.sort((a, b) => (parseInt(String(b.hot).replace(/[^\d]/g, "")) || 0) - (parseInt(String(a.hot).replace(/[^\d]/g, "")) || 0) || (a.rank || 0) - (b.rank || 0));
  const top = matches.slice(0, 50);
  panel.classList.add("show");
  document.getElementById("searchHeader").innerHTML =
    `🔎 找到 <b style="color:var(--gold)">${matches.length}</b> 条相关热点${matches.length > 50 ? "（显示前 50 条）" : ""}`;
  if (!top.length) {
    body.innerHTML = `<div class="search-empty">😢 没有包含「${esc(query)}」的热点，换个关键词试试</div>`;
    return;
  }
  const hlRe = new RegExp(`(${escapeReg(query)})`, "gi");
  body.innerHTML = top.map(it => `<div class="search-item">
      <span class="search-item-rank">${it.rank || "·"}</span>
      <a class="search-item-title" href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.title).replace(hlRe, '<mark class="hl">$1</mark>')}</a>
      <span class="search-item-plat" style="background:${it.platColor}">${esc(it.platLabel)}</span>
    </div>`).join("");
}

// ══════════════════════════════════════════════════════
// 预热其余分类 + 自动刷新 + 回顶
// ══════════════════════════════════════════════════════
async function preloadAllCategories() {
  for (const cat of Object.keys(CATEGORIES)) {
    const meta = catMeta[cat];
    if (meta && Date.now() - meta.fetchTime < CACHE_TTL) continue;
    try {
      await doFetch(CATEGORIES[cat], false);
      if (cat === currentCat) { renderView(); updateTimeDisplay(); }
    } catch {}
  }
  saveLocal();
}

setInterval(() => {
  // 静默刷新：当前视图 + 已缓存分类（避免 stale 增长）
  silentRefresh(pidsForView(currentCat, currentPlat));
  Object.keys(catMeta).forEach(cat => {
    if (cat !== currentCat && Date.now() - catMeta[cat].fetchTime > CACHE_TTL) {
      const pids = cat === HOT_CAT ? MERGE_PIDS : (CATEGORIES[cat] || []);
      doFetch(pids, false).catch(() => {});
    }
  });
}, 5 * 60 * 1000);

// Keep-alive（每 4.5 分钟 ping 一次）：页面开着时保持后端不休眠
// （Render 免费版 15 分钟无流量会休眠；云端 Worker Cron 也会每 3 分钟服务端保活）
setInterval(() => { fetch("/api/ping").catch(() => {}); }, 4.5 * 60 * 1000);

window.addEventListener("scroll", () => {
  document.getElementById("backTop").classList.toggle("show", window.scrollY > 500);
}, { passive: true });

// ══════════════════════════════════════════════════════
// 自定义背景图（图片存浏览器 IndexedDB，不上传）
// ══════════════════════════════════════════════════════
const BG_MAX_IMPORT = 60;        // 文件夹抽样上限（1366 张全存会撑爆）
const BG_SETTINGS_KEY = "hn_bg_settings";
const BG_DEFAULT_URL = "/static/bg/default.jpg";   // 内置默认背景（服务端静态资源）

function bgSettings() {
  try { return JSON.parse(localStorage.getItem(BG_SETTINGS_KEY)) || {}; } catch { return {}; }
}
function bgSaveSettings(s) {
  localStorage.setItem(BG_SETTINGS_KEY, JSON.stringify({ ...bgSettings(), ...s }));
}

// IndexedDB 简易封装（库名 hotnews-bg，表 images: {id, blob}）
function bgDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open("hotnews-bg", 1);
    req.onupgradeneeded = () => req.result.createObjectStore("images", { keyPath: "id", autoIncrement: true });
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function bgPut(blob) {
  const db = await bgDB();
  return new Promise((res, rej) => {
    const tx = db.transaction("images", "readwrite");
    tx.objectStore("images").add({ blob });
    tx.oncomplete = () => res();
    tx.onerror = () => rej(tx.error);
  });
}
async function bgAll() {
  const db = await bgDB();
  return new Promise((res, rej) => {
    const req = db.transaction("images").objectStore("images").getAll();
    req.onsuccess = () => res(req.result || []);
    req.onerror = () => rej(req.error);
  });
}
async function bgClear() {
  const db = await bgDB();
  return new Promise((res) => {
    const tx = db.transaction("images", "readwrite");
    tx.objectStore("images").clear();
    tx.oncomplete = () => res();
    tx.onerror = () => res();
  });
}

// 压缩：最长边 1600px、jpeg 82%（几十 KB 的剧照不再二次放大）
function bgCompress(file) {
  return new Promise((resolve) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      const scale = Math.min(1, 1600 / Math.max(img.width, img.height));
      const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
      const canvas = document.createElement("canvas");
      canvas.width = w; canvas.height = h;
      canvas.getContext("2d").drawImage(img, 0, 0, w, h);
      canvas.toBlob((b) => resolve(b || file.slice(0, file.size, file.type)), "image/jpeg", .82);
    };
    img.onerror = () => { URL.revokeObjectURL(url); resolve(null); };
    img.src = url;
  });
}

// 导入：文件多时按文件名排序后均匀抽样
async function bgImport(fileList, sample) {
  const status = document.getElementById("bgStatus");
  let files = [...fileList].filter(f => /^image\//.test(f.type));
  if (!files.length) { status.textContent = "没有找到图片"; return; }
  status.textContent = `发现 ${files.length} 张图片，处理中…`;
  files.sort((a, b) => (a.webkitRelativePath || a.name).localeCompare(b.webkitRelativePath || b.name));
  if (sample && files.length > BG_MAX_IMPORT) {
    const step = files.length / BG_MAX_IMPORT;
    files = Array.from({ length: BG_MAX_IMPORT }, (_, i) => files[Math.floor(i * step)]);
  }
  let ok = 0;
  for (const f of files) {
    const blob = await bgCompress(f);
    if (blob) { await bgPut(blob); ok++; }
  }
  status.textContent = `已导入 ${ok} 张` + (sample && ok >= BG_MAX_IMPORT ? `（从更多图片中抽样）` : "");
  // 导入即启用第一张
  const all = await bgAll();
  if (all.length) { bgSaveSettings({ bg: "custom", id: all[all.length - 1].id }); }
  applyBackground();
  renderBgThumbs();
}

let _bgUrl = null;
async function applyBackground() {
  const s = bgSettings();
  const body = document.body;
  // 模式：default（内置默认壁纸）| custom（自己选的图）| off（关闭）；老设置自动迁移
  const mode = s.bg ?? (s.on && s.id ? "custom" : "default");
  body.classList.remove("bg-on");
  if (mode === "off") return;
  body.style.setProperty("--bg-opacity", (s.opacity ?? .18));

  if (mode === "custom" && s.id) {
    try {
      const all = await bgAll();
      const item = all.find(x => x.id === s.id);
      if (item) {
        if (_bgUrl) URL.revokeObjectURL(_bgUrl);
        _bgUrl = URL.createObjectURL(item.blob);
        setBgImg(_bgUrl);
        return;
      }
    } catch { /* 图没了，落回默认 */ }
  }
  if (_bgUrl) { URL.revokeObjectURL(_bgUrl); _bgUrl = null; }
  setBgImg(BG_DEFAULT_URL);
}
function setBgImg(u) {
  document.body.style.setProperty("--bg-img", `url("${u}")`);
  document.body.classList.add("bg-on");
}

const bgThumbCache = new Map();
async function renderBgThumbs() {
  const wrap = document.getElementById("bgThumbs");
  const s = bgSettings();
  try {
    const all = await bgAll();
    wrap.innerHTML = all.map(x => {
      if (!bgThumbCache.has(x.id)) bgThumbCache.set(x.id, URL.createObjectURL(x.blob));
      return `<div class="bg-thumb${x.id === s.id ? " active" : ""}" style="background-image:url('${bgThumbCache.get(x.id)}')"
        onclick="pickBg(${x.id})" title="设为背景"></div>`;
    }).join("") || `<div style="font-size:.74rem;color:var(--muted);padding:.4rem 0">还没有图片，先选个文件夹吧</div>`;
  } catch {
    wrap.innerHTML = `<div style="font-size:.74rem;color:var(--muted)">当前环境不支持本地存储</div>`;
  }
}

function openBgPanel() {
  document.getElementById("bgModal").classList.add("open");
  const s = bgSettings();
  const slider = document.getElementById("bgOpacity");
  slider.value = Math.round((s.opacity ?? .18) * 100);
  document.getElementById("bgOpacityVal").textContent = slider.value + "%";
  renderBgThumbs();
}
function closeBgPanel() { document.getElementById("bgModal").classList.remove("open"); }
function pickBg(id) {
  bgSaveSettings({ bg: "custom", id });
  applyBackground();
  renderBgThumbs();
}
function useDefaultBg() {
  bgSaveSettings({ bg: "default" });
  applyBackground();
  renderBgThumbs();
}
function bgOff() {
  bgSaveSettings({ bg: "off" });
  applyBackground();
}
function setBgOpacity(v) {
  document.getElementById("bgOpacityVal").textContent = v + "%";
  document.body.style.setProperty("--bg-opacity", v / 100);
  bgSaveSettings({ opacity: v / 100 });
}
async function clearBgImages() {
  if (!confirm("删除全部已导入的背景图？")) return;
  await bgClear();
  bgThumbCache.forEach(u => URL.revokeObjectURL(u));
  bgThumbCache.clear();
  localStorage.removeItem(BG_SETTINGS_KEY);   // 回到默认背景
  applyBackground();
  document.getElementById("bgStatus").textContent = "";
  renderBgThumbs();
}

// ══════════════════════════════════════════════════════
// 初始化
// ══════════════════════════════════════════════════════
(function init() {
  applyTheme(localStorage.getItem("hn_theme") ||
    (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
  updateAuthUI();
  loadLocal();               // 秒开：先渲染本地缓存
  renderPlatTabs();
  refreshCurrent();          // 再静默刷新数据
  setTimeout(preloadAllCategories, 3500);

  const sbox = document.getElementById("globalSearch");
  sbox.addEventListener("input", e => onSearchInput(e.target.value));
  sbox.addEventListener("keydown", e => {
    if (e.key === "Escape") { clearSearch(); e.preventDefault(); }
    if (e.key === "Enter") {
      const first = document.querySelector(".search-item-title");
      if (first) window.open(first.href, "_blank", "noopener");
    }
  });
  document.addEventListener("keydown", e => {
    if (e.key === "/" && !["INPUT", "TEXTAREA"].includes(document.activeElement.tagName)) {
      sbox.focus(); e.preventDefault();
    }
  });

  // 背景图：恢复上次设置 + 绑定导入入口
  applyBackground();
  document.getElementById("bgFolderInput").addEventListener("change", e => { bgImport(e.target.files, true); e.target.value = ""; });
  document.getElementById("bgFileInput").addEventListener("change", e => { bgImport(e.target.files, false); e.target.value = ""; });
})();
</script>
